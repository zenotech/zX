[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zx_backend"
version = "0.1.0"
authors = [
    { name = "Zenotech Ltd", email = "info@zenotech.com" }
]
description = "zX Parametric Exploration sidecar Python backend"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pandas>=2.0.0",
    "pydantic>=2.6.0",
    "paramiko>=3.4.0",
    "websockets>=12.0",
    "python-multipart",
]

[tool.setuptools]
packages = ["zx_backend"]
